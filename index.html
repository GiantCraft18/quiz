<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎃 Праздничная Викторина</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Creepster','Segoe UI',Tahoma,sans-serif; }
body {
  background: radial-gradient(ellipse at top, #2a0845 0%, #1a0525 40%, #0a0112 100%);
  min-height:100vh;
  color:#e8d5b7;
  overflow-x:hidden;
  position:relative;
}
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    radial-gradient(2px 2px at 20% 30%, rgba(255,165,0,0.6), transparent),
    radial-gradient(2px 2px at 60% 70%, rgba(255,140,0,0.4), transparent),
    radial-gradient(1px 1px at 80% 20%, rgba(255,200,100,0.5), transparent),
    radial-gradient(2px 2px at 35% 80%, rgba(255,100,0,0.4), transparent),
    radial-gradient(1px 1px at 90% 55%, rgba(255,180,80,0.5), transparent);
  background-size: 300px 300px, 400px 400px, 250px 250px, 350px 350px, 200px 200px;
  animation: flicker 4s infinite alternate;
  pointer-events:none;
  z-index:0;
}
@keyframes flicker {
  0%,100% { opacity:0.6; }
  50% { opacity:1; }
}
body::after {
  content:'';
  position:fixed;
  bottom:-50px; left:-50px; right:-50px;
  height:200px;
  background: radial-gradient(ellipse at 30% 100%, rgba(255,100,0,0.15), transparent 60%),
              radial-gradient(ellipse at 70% 100%, rgba(200,0,50,0.15), transparent 60%);
  pointer-events:none;
  z-index:0;
}
.screen { display:none; min-height:100vh; position:relative; z-index:1; }
.screen.active { display:block; }
.hidden { display:none !important; }

/* TYPOGRAPHY */
h1, h2, h3 { font-family:'Creepster','Segoe UI',cursive; letter-spacing:2px; text-shadow:0 0 20px rgba(255,100,0,0.6), 0 0 40px rgba(255,50,0,0.3); }

/* AUTH */
.auth-container { max-width:440px; margin:70px auto; background:linear-gradient(135deg,rgba(40,10,60,0.85),rgba(20,5,35,0.9)); backdrop-filter:blur(20px); border-radius:24px; padding:44px; box-shadow:0 20px 60px rgba(0,0,0,0.7), 0 0 80px rgba(255,100,0,0.15), inset 0 0 40px rgba(255,80,0,0.05); border:2px solid rgba(255,140,0,0.35); position:relative; }
.auth-container::before {
  content:'🎃';
  position:absolute; top:-30px; left:50%; transform:translateX(-50%);
  font-size:60px;
  filter: drop-shadow(0 0 20px rgba(255,140,0,0.8));
  animation: ghostFloat 3s ease-in-out infinite;
}
@keyframes ghostFloat {
  0%,100% { transform:translateX(-50%) translateY(0); }
  50% { transform:translateX(-50%) translateY(-8px); }
}
.auth-container h1 { font-size:34px; text-align:center; margin-bottom:8px; color:#ffb86b; }
.subtitle { text-align:center; opacity:0.75; margin-bottom:30px; font-size:14px; color:#c9a0dc; }
.tabs { display:flex; background:rgba(0,0,0,0.5); border-radius:14px; padding:5px; margin-bottom:26px; border:1px solid rgba(255,140,0,0.2); }
.tab-btn { flex:1; padding:12px; background:transparent; border:none; color:#c9a0dc; cursor:pointer; border-radius:10px; font-size:15px; font-family:'Segoe UI',sans-serif; transition:0.3s; font-weight:600; }
.tab-btn.active { background:linear-gradient(135deg,#ff6b00,#c72c00); color:#fff; box-shadow:0 0 20px rgba(255,100,0,0.5); }
.auth-form { display:none; flex-direction:column; gap:14px; }
.auth-form.active { display:flex; }
.auth-form input { padding:14px 16px; background:rgba(0,0,0,0.4); border:1px solid rgba(255,140,0,0.25); border-radius:12px; color:#ffb86b; font-size:15px; font-family:'Segoe UI',sans-serif; transition:0.3s; }
.auth-form input:focus { outline:none; border-color:#ff8c00; background:rgba(0,0,0,0.5); box-shadow:0 0 15px rgba(255,140,0,0.4); }
.auth-form input::placeholder { color:rgba(200,160,220,0.5); }
.btn-primary { padding:14px; background:linear-gradient(135deg,#ff6b00,#c72c00); border:none; border-radius:12px; color:#fff; font-size:16px; font-weight:bold; cursor:pointer; transition:0.3s; box-shadow:0 6px 20px rgba(255,100,0,0.45), inset 0 1px 0 rgba(255,255,255,0.2); font-family:'Segoe UI',sans-serif; letter-spacing:1px; }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(255,100,0,0.6), 0 0 40px rgba(255,80,0,0.4); }
.btn-secondary { padding:14px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,140,0,0.3); border-radius:12px; color:#ffb86b; font-size:16px; cursor:pointer; font-family:'Segoe UI',sans-serif; }
.error { color:#ff5c7c; font-size:13px; text-align:center; min-height:18px; font-family:'Segoe UI',sans-serif; }

/* TOP BAR */
.top-bar { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; background:linear-gradient(180deg,rgba(40,10,60,0.9),rgba(20,5,35,0.7)); backdrop-filter:blur(15px); border-bottom:2px solid rgba(255,140,0,0.25); box-shadow:0 4px 30px rgba(0,0,0,0.5); }
.logo { font-size:22px; font-weight:bold; color:#ff8c00; font-family:'Creepster',cursive; letter-spacing:3px; text-shadow:0 0 15px rgba(255,140,0,0.7), 0 0 30px rgba(255,60,0,0.4); }
.user-info { display:flex; align-items:center; gap:14px; }
.user-info span { font-size:13px; background:rgba(255,140,0,0.15); padding:6px 14px; border-radius:20px; border:1px solid rgba(255,140,0,0.3); color:#ffb86b; font-family:'Segoe UI',sans-serif; font-weight:600; }
.avatar { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#ff8c00,#c72c00); display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:18px; border:2px solid rgba(255,180,80,0.6); box-shadow:0 0 15px rgba(255,140,0,0.5); color:#fff; font-family:'Segoe UI',sans-serif; }
.btn-icon { background:rgba(255,140,0,0.15); border:1px solid rgba(255,140,0,0.3); color:#ffb86b; font-size:18px; width:44px; height:44px; border-radius:50%; cursor:pointer; transition:0.3s; }
.btn-icon:hover { background:rgba(255,140,0,0.3); box-shadow:0 0 20px rgba(255,140,0,0.5); }

/* NAV */
.main-nav { display:flex; justify-content:center; gap:10px; padding:22px; flex-wrap:wrap; }
.nav-btn { padding:10px 24px; background:rgba(255,140,0,0.08); border:1px solid rgba(255,140,0,0.25); color:#c9a0dc; border-radius:25px; cursor:pointer; font-size:14px; transition:0.3s; font-family:'Segoe UI',sans-serif; font-weight:600; }
.nav-btn:hover { background:rgba(255,140,0,0.18); color:#ffb86b; box-shadow:0 0 15px rgba(255,140,0,0.3); }
.nav-btn.active { background:linear-gradient(135deg,#ff6b00,#c72c00); border-color:transparent; color:#fff; box-shadow:0 6px 25px rgba(255,100,0,0.6), 0 0 40px rgba(255,60,0,0.3); }

#content { max-width:1200px; margin:0 auto; padding:20px; }
.view { display:none; }
.view.active { display:block; }
.view h2 { margin-bottom:24px; font-size:32px; color:#ff8c00; }

/* QUIZ CARDS */
.quiz-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:22px; }
.quiz-card { background:linear-gradient(160deg,rgba(40,10,60,0.9),rgba(20,5,35,0.95)); border:2px solid rgba(255,140,0,0.25); border-radius:22px; padding:24px; cursor:pointer; transition:0.4s; position:relative; overflow:hidden; }
.quiz-card:hover { transform:translateY(-8px); box-shadow:0 25px 50px rgba(0,0,0,0.6), 0 0 60px rgba(255,100,0,0.3); border-color:rgba(255,160,0,0.6); }
.quiz-card::before { content:''; position:absolute; top:-50%; right:-50%; width:200%; height:200%; background:radial-gradient(circle, var(--accent,#ff6b00) 0%, transparent 55%); opacity:0.18; pointer-events:none; animation: batGlow 6s infinite alternate; }
@keyframes batGlow { 0%{opacity:0.12;} 100%{opacity:0.28;} }
.quiz-emoji { font-size:60px; display:block; margin-bottom:12px; filter:drop-shadow(0 0 15px rgba(255,140,0,0.6)); position:relative; z-index:1; }
.quiz-card h3 { font-size:24px; margin-bottom:8px; color:#ffb86b; position:relative; z-index:1; }
.quiz-card p { font-size:13px; color:#c9a0dc; margin-bottom:16px; line-height:1.5; font-family:'Segoe UI',sans-serif; position:relative; z-index:1; }
.quiz-meta { display:flex; justify-content:space-between; align-items:center; font-size:12px; position:relative; z-index:1; }
.quiz-difficulty { padding:5px 12px; border-radius:14px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,140,0,0.3); color:#ffb86b; font-family:'Segoe UI',sans-serif; font-weight:600; }
.play-btn { padding:9px 20px; background:linear-gradient(135deg,#ff6b00,#c72c00); border:none; border-radius:20px; color:#fff; cursor:pointer; font-size:13px; font-weight:bold; font-family:'Segoe UI',sans-serif; transition:0.3s; box-shadow:0 4px 15px rgba(255,100,0,0.4); }
.play-btn:hover { transform:scale(1.05); box-shadow:0 6px 25px rgba(255,100,0,0.6); }
.quiz-card.completed { opacity:0.85; }
.quiz-card.completed::after { content:'✓ ПРОЙДЕНО'; position:absolute; top:14px; right:14px; background:linear-gradient(135deg,#4caf50,#2e7d32); padding:5px 12px; border-radius:12px; font-size:10px; font-weight:bold; letter-spacing:1px; font-family:'Segoe UI',sans-serif; box-shadow:0 0 15px rgba(76,175,80,0.5); z-index:2; }

/* PLAYER TAGS над квизом */
.quiz-players { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; align-items:center; min-height:26px; position:relative; z-index:1; }
.quiz-players-label { font-size:11px; color:#c9a0dc; font-family:'Segoe UI',sans-serif; opacity:0.7; margin-right:4px; }
.player-tag { display:flex; align-items:center; gap:5px; padding:3px 10px 3px 3px; background:rgba(255,140,0,0.12); border:1px solid rgba(255,140,0,0.35); border-radius:20px; font-size:11px; font-family:'Segoe UI',sans-serif; color:#ffb86b; font-weight:600; transition:0.3s; }
.player-tag:hover { background:rgba(255,140,0,0.25); box-shadow:0 0 12px rgba(255,140,0,0.5); }
.player-tag .mini-avatar { width:20px; height:20px; border-radius:50%; background:linear-gradient(135deg,#ff8c00,#c72c00); display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff; font-weight:bold; }
.player-tag.invited { background:rgba(76,175,80,0.15); border-color:rgba(76,175,80,0.5); color:#8bc34a; }
.player-tag.online::before { content:''; width:6px; height:6px; border-radius:50%; background:#4caf50; box-shadow:0 0 8px #4caf50; }

/* ACHIEVEMENTS */
.achievements-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; }
.achievement { background:linear-gradient(160deg,rgba(40,10,60,0.7),rgba(20,5,35,0.85)); border:1px solid rgba(255,140,0,0.2); border-radius:18px; padding:22px; text-align:center; transition:0.3s; }
.achievement.unlocked { background:linear-gradient(160deg,rgba(255,140,0,0.18),rgba(199,44,0,0.15)); border-color:rgba(255,180,80,0.6); box-shadow:0 10px 35px rgba(255,140,0,0.3), inset 0 0 30px rgba(255,140,0,0.08); }
.achievement.locked { opacity:0.4; filter:grayscale(0.8); }
.achievement-icon { font-size:48px; margin-bottom:12px; filter:drop-shadow(0 0 12px rgba(255,140,0,0.6)); }
.achievement h4 { font-size:16px; margin-bottom:6px; color:#ffb86b; font-family:'Segoe UI',sans-serif; }
.achievement p { font-size:12px; color:#c9a0dc; font-family:'Segoe UI',sans-serif; }

/* LEADERBOARD */
.leaderboard { display:flex; flex-direction:column; gap:12px; }
.leaderboard-row { display:flex; align-items:center; gap:16px; padding:16px 22px; background:linear-gradient(90deg,rgba(40,10,60,0.7),rgba(20,5,35,0.6)); border-radius:16px; border:1px solid rgba(255,140,0,0.15); transition:0.3s; }
.leaderboard-row:hover { border-color:rgba(255,140,0,0.4); box-shadow:0 0 25px rgba(255,140,0,0.15); }
.leaderboard-row.me { background:linear-gradient(90deg,rgba(255,140,0,0.2),rgba(199,44,0,0.15)); border-color:rgba(255,160,0,0.6); box-shadow:0 0 30px rgba(255,140,0,0.3); }
.rank { font-size:22px; font-weight:bold; width:44px; font-family:'Creepster',cursive; }
.rank.gold { color:#ffd700; text-shadow:0 0 15px #ffd700; }
.rank.silver { color:#e0e0e0; text-shadow:0 0 15px #c0c0c0; }
.rank.bronze { color:#cd7f32; text-shadow:0 0 15px #cd7f32; }
.leaderboard-row .avatar { width:38px; height:38px; font-size:15px; }
.leaderboard-name { flex:1; font-weight:bold; color:#ffb86b; font-family:'Segoe UI',sans-serif; }
.leaderboard-xp { font-size:14px; color:#c9a0dc; font-family:'Segoe UI',sans-serif; }

/* FRIENDS */
.friends-section { max-width:720px; }
.search-box { display:flex; gap:10px; margin-bottom:20px; }
.search-box input { flex:1; padding:13px 18px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,140,0,0.25); border-radius:12px; color:#ffb86b; font-size:15px; font-family:'Segoe UI',sans-serif; }
.search-box input:focus { outline:none; border-color:#ff8c00; box-shadow:0 0 15px rgba(255,140,0,0.4); }
.friends-section h3 { margin:26px 0 12px; font-size:20px; color:#ff8c00; }
.friends-list, .invites-list, #searchResults { display:flex; flex-direction:column; gap:10px; }
.friend-item { display:flex; align-items:center; gap:14px; padding:14px 18px; background:linear-gradient(90deg,rgba(40,10,60,0.7),rgba(20,5,35,0.6)); border-radius:14px; border:1px solid rgba(255,140,0,0.15); transition:0.3s; }
.friend-item:hover { border-color:rgba(255,140,0,0.4); }
.friend-item .avatar { width:38px; height:38px; font-size:15px; }
.friend-item .name { flex:1; font-weight:bold; color:#ffb86b; font-family:'Segoe UI',sans-serif; }
.friend-item button { padding:8px 16px; background:linear-gradient(135deg,#ff6b00,#c72c00); border:none; border-radius:10px; color:#fff; cursor:pointer; font-size:13px; font-family:'Segoe UI',sans-serif; font-weight:600; transition:0.3s; }
.friend-item button:hover { box-shadow:0 0 20px rgba(255,140,0,0.5); }

/* GAME */
.game-header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; background:linear-gradient(180deg,rgba(40,10,60,0.95),rgba(20,5,35,0.8)); backdrop-filter:blur(15px); border-bottom:2px solid rgba(255,140,0,0.3); }
.game-info { display:flex; gap:20px; font-size:15px; color:#ffb86b; font-family:'Segoe UI',sans-serif; font-weight:600; }
.game-timer { width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#ff6b00,#c72c00); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:bold; box-shadow:0 0 30px rgba(255,100,0,0.6), inset 0 0 15px rgba(255,255,255,0.15); font-family:'Segoe UI',sans-serif; }
.game-timer.warning { animation:pulse 0.5s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.15); box-shadow:0 0 45px rgba(255,60,0,0.9);} }
.game-body { display:grid; grid-template-columns:1fr 340px; gap:22px; padding:24px; max-width:1400px; margin:0 auto; }
.question-area h2 { font-size:26px; margin-bottom:24px; line-height:1.4; background:linear-gradient(160deg,rgba(40,10,60,0.9),rgba(20,5,35,0.95)); padding:26px; border-radius:18px; border:2px solid rgba(255,140,0,0.3); color:#ffb86b; font-family:'Segoe UI',sans-serif; box-shadow:inset 0 0 40px rgba(255,80,0,0.05); }
.answers { display:flex; flex-direction:column; gap:12px; }
.answer-btn { padding:18px 24px; background:rgba(255,140,0,0.08); border:2px solid rgba(255,140,0,0.25); border-radius:14px; color:#e8d5b7; font-size:16px; cursor:pointer; text-align:left; transition:0.3s; font-family:'Segoe UI',sans-serif; font-weight:500; }
.answer-btn:hover:not(:disabled) { background:rgba(255,140,0,0.2); transform:translateX(6px); border-color:rgba(255,160,0,0.6); box-shadow:0 0 25px rgba(255,140,0,0.3); }
.answer-btn.correct { background:linear-gradient(135deg,rgba(76,175,80,0.4),rgba(46,125,50,0.5)); border-color:#4caf50; box-shadow:0 0 30px rgba(76,175,80,0.5); }
.answer-btn.wrong { background:linear-gradient(135deg,rgba(244,67,54,0.4),rgba(198,40,40,0.5)); border-color:#f44336; box-shadow:0 0 30px rgba(244,67,54,0.5); }
.answer-btn:disabled { cursor:not-allowed; }

/* CHAT */
.chat-panel { background:linear-gradient(160deg,rgba(40,10,60,0.85),rgba(20,5,35,0.9)); border-radius:18px; padding:18px; display:flex; flex-direction:column; height:520px; border:2px solid rgba(255,140,0,0.25); box-shadow:inset 0 0 40px rgba(255,80,0,0.05); }
.chat-panel h3 { margin-bottom:14px; font-size:16px; color:#ff8c00; font-family:'Segoe UI',sans-serif; }
.chat-messages { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:6px; }
.chat-messages::-webkit-scrollbar { width:5px; }
.chat-messages::-webkit-scrollbar-thumb { background:rgba(255,140,0,0.4); border-radius:5px; }
.chat-msg { background:rgba(255,140,0,0.08); padding:9px 13px; border-radius:12px; font-size:13px; word-wrap:break-word; font-family:'Segoe UI',sans-serif; color:#e8d5b7; border-left:3px solid rgba(255,140,0,0.4); }
.chat-msg .author { font-weight:bold; color:#ffb86b; margin-right:6px; }
.chat-msg.system { background:rgba(255,140,0,0.15); text-align:center; font-style:italic; color:#c9a0dc; border-left:none; border-top:1px dashed rgba(255,140,0,0.3); }
.chat-input { display:flex; gap:8px; margin-top:14px; }
.chat-input input { flex:1; padding:11px 14px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,140,0,0.25); border-radius:10px; color:#ffb86b; font-size:13px; font-family:'Segoe UI',sans-serif; }
.chat-input input:focus { outline:none; border-color:#ff8c00; }
.chat-input button { padding:0 18px; background:linear-gradient(135deg,#ff6b00,#c72c00); border:none; border-radius:10px; color:#fff; font-size:18px; cursor:pointer; transition:0.3s; }
.chat-input button:hover { box-shadow:0 0 20px rgba(255,140,0,0.6); }

/* MODAL */
.modal { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; backdrop-filter:blur(5px); }
.modal.hidden { display:none; }
.modal-content { background:linear-gradient(160deg,rgba(40,10,60,0.95),rgba(20,5,35,0.98)); padding:42px; border-radius:26px; max-width:520px; width:100%; border:2px solid rgba(255,140,0,0.4); box-shadow:0 30px 80px rgba(0,0,0,0.8), 0 0 100px rgba(255,100,0,0.2); animation:modalIn 0.35s ease; position:relative; }
.modal-content::before {
  content:'🎃';
  position:absolute; top:-28px; right:24px;
  font-size:44px;
  filter: drop-shadow(0 0 20px rgba(255,140,0,0.9));
}
@keyframes modalIn { from{transform:scale(0.9);opacity:0;} to{transform:scale(1);opacity:1;} }
.modal-content h2 { margin-bottom:18px; text-align:center; color:#ff8c00; font-size:28px; }
.result-stats { display:flex; justify-content:space-around; margin:26px 0; flex-wrap:wrap; gap:16px; }
.stat { text-align:center; }
.stat-value { font-size:36px; font-weight:bold; display:block; color:#ffb86b; font-family:'Creepster',cursive; text-shadow:0 0 20px rgba(255,140,0,0.7); }
.stat-label { font-size:13px; color:#c9a0dc; font-family:'Segoe UI',sans-serif; margin-top:4px; display:block; }
.modal-content select { width:100%; padding:13px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,140,0,0.3); border-radius:12px; color:#ffb86b; font-size:15px; margin:18px 0; font-family:'Segoe UI',sans-serif; }
.modal-buttons { display:flex; gap:12px; }
.modal-buttons button { flex:1; }
.round-result { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.95); padding:42px 64px; border-radius:22px; text-align:center; z-index:100; border:2px solid rgba(255,140,0,0.5); box-shadow:0 0 80px rgba(255,100,0,0.5); }

/* TOAST */
.toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,rgba(40,10,60,0.98),rgba(20,5,35,0.98)); padding:15px 30px; border-radius:30px; font-size:15px; z-index:300; border:2px solid rgba(255,140,0,0.5); box-shadow:0 0 40px rgba(255,100,0,0.4); color:#ffb86b; font-family:'Segoe UI',sans-serif; font-weight:600; animation:toastIn 0.35s ease; }
@keyframes toastIn { from{transform:translate(-50%,20px);opacity:0;} to{transform:translate(-50%,0);opacity:1;} }

/* CHAT PARTICIPANTS */
.chat-participants { display:flex; gap:6px; flex-wrap:wrap; padding:10px; margin-bottom:12px; background:rgba(0,0,0,0.3); border-radius:12px; border:1px solid rgba(255,140,0,0.2); max-height:80px; overflow-y:auto; }

<script>
/* =========================================================
   DATA
   ========================================================= */

      {q:'Что поют на Рождество?', answers:['Рок','Колядки','Рэп','Опера'], correct:1}

    questions:[
      {q:'Во сколько начинают бить куранты?', answers:['21:00','22:00','00:00','01:00'], correct:2},
      {q:'Что загадывают под бой курантов?', answers:['Желание','Тосты','Песни','Стихи'], correct:0},
      {q:'Что традиционно пьют в новогоднюю ночь?', answers:['Воду','Шампанское','Сок','Чай'], correct:1},
      {q:'В какой стране придумали традицию с оливье?', answers:['Франция','СССР','Италия','Испания'], correct:1},
      {q:'Какое дерево украшают на Новый год в России?', answers:['Дуб','Ёлка','Берёза','Сосна'], correct:1}

  },
  valentine: {

    questions:[
      {q:'Какого числа День Валентина?', answers:['13 февраля','14 февраля','15 февраля','1 февраля'], correct:1},
      {q:'Какой символ праздника?', answers:['Роза','Сердце','Кольцо','Лента'], correct:1},

      {q:'Что традиционно дарят?', answers:['Конфеты и цветы','Книги','Технику','Одежду'], correct:0}

const ACHIEVEMENTS = [
  {id:'first_game', icon:'🎯', name:'Первый шаг', desc:'Пройдите первую викторину', check:u => u.gamesPlayed>=1},
  {id:'five_games', icon:'🔥', name:'В ударе', desc:'Пройдите 5 викторин', check:u => u.gamesPlayed>=5},
  {id:'ten_games', icon:'🏅', name:'Опытный игрок', desc:'Пройдите 10 викторин', check:u => u.gamesPlayed>=10},
  {id:'perfect', icon:'💯', name:'Идеально!', desc:'Пройдите викторину без ошибок', check:u => u.perfectGames>=1},
  {id:'five_perfect', icon:'⭐', name:'Перфекционист', desc:'5 викторин без ошибок', check:u => u.perfectGames>=5},
  {id:'all_quizzes', icon:'👑', name:'Коллекционер', desc:'Пройдите все викторины', check:u => Object.keys(u.completed||{}).length >= Object.keys(QUIZZES).length},
  {id:'level_5', icon:'📈', name:'Растущий', desc:'Достигните 5 уровня', check:u => u.level>=5},
  {id:'level_10', icon:'🌟', name:'Звезда', desc:'Достигните 10 уровня', check:u => u.level>=10},
  {id:'friends_3', icon:'👥', name:'Компания', desc:'Добавьте 3 друзей', check:u => (u.friends||[]).length>=3},
  {id:'social', icon:'💬', name:'Болтун', desc:'Отправьте 10 сообщений', check:u => (u.messagesSent||0)>=10},
  {id:'halloween_master', icon:'🎃', name:'Повелитель тыкв', desc:'Пройдите викторину о Хэллоуине', check:u => u.completed && u.completed.halloween},
  {id:'newyear_master', icon:'🎁', name:'Новогодний', desc:'Пройдите викторину о Новом годе', check:u => u.completed && u.completed.newYear}
];

/* =========================================================
   STORAGE
   ========================================================= */
const DB = {
  get users() { return JSON.parse(localStorage.getItem('hq_users') || '{}'); },
  set users(v) { localStorage.setItem('hq_users', JSON.stringify(v)); },
  get session() { return localStorage.getItem('hq_session'); },
  set session(v) { v ? localStorage.setItem('hq_session', v) : localStorage.removeItem('hq_session'); },
  get invites() { return JSON.parse(localStorage.getItem('hq_invites') || '[]'); },
  set invites(v) { localStorage.setItem('hq_invites', JSON.stringify(v)); },
  get online() { return JSON.parse(localStorage.getItem('hq_online') || '{}'); },
  set online(v) { localStorage.setItem('hq_online', JSON.stringify(v)); }
};

function defaultUser(name) {
  return {
    username: name, password: '', xp: 0, level: 1,
    gamesPlayed: 0, perfectGames: 0, messagesSent: 0,
    completed: {}, friends: [], achievements: [], createdAt: Date.now(),
    lastSeen: Date.now()
  };
}

function xpForLevel(lvl) { return lvl * 100; }

function addXp(user, amount) {
  user.xp += amount;
  while (user.xp >= xpForLevel(user.level)) {
    user.xp -= xpForLevel(user.level);
    user.level++;
    showToast(`🎉 Уровень ${user.level}!`);
  }
}

/* =========================================================
   STATE
   ========================================================= */
let currentUser = null;
let game = null;
let timerInterval = null;
let heartbeatInterval = null;

/* =========================================================
   DOM
   ========================================================= */
const $ = id => document.getElementById(id);
const screens = { auth: $('authScreen'), main: $('mainScreen'), game: $('gameScreen') };

function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.add('hidden'), 2500);
}

/* =========================================================
   ONLINE STATUS (heartbeat)
   ========================================================= */
function heartbeat() {
  if (!currentUser) return;
  const online = DB.online;
  online[currentUser.username] = Date.now();
  // Чистим тех, кто не был онлайн >15 сек
  const now = Date.now();
  Object.keys(online).forEach(k => { if (now - online[k] > 15000) delete online[k]; });
  DB.online = online;
}

function isOnline(username) {
  const online = DB.online;
  return online[username] && (Date.now() - online[username] < 15000);
}

setInterval(() => {
  if (currentUser) {
    heartbeat();
    // Обновляем отображение в реальном времени
    if (screens.main.classList.contains('active')) {
      renderQuizzes();
      if ($('friendsView').classList.contains('active')) renderFriends();
    }
  }
}, 4000);

/* =========================================================
   AUTH
   ========================================================= */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    $('loginForm').classList.toggle('active', tab === 'login');
    $('registerForm').classList.toggle('active', tab === 'register');
  });
});

$('registerForm').addEventListener('submit', e => {
  e.preventDefault();
  const u = $('regUsername').value.trim();
  const p = $('regPassword').value;
  const p2 = $('regPassword2').value;
  const err = $('regError');
  err.textContent = '';

  if (u.length < 3) return err.textContent = 'Имя минимум 3 символа';
  if (p.length < 4) return err.textContent = 'Пароль минимум 4 символа';
  if (p !== p2) return err.textContent = 'Пароли не совпадают';

  const users = DB.users;
  if (users[u.toLowerCase()]) return err.textContent = 'Имя занято';

  const user = defaultUser(u);
  user.password = btoa(p);
  users[u.toLowerCase()] = user;
  DB.users = users;
  DB.session = u.toLowerCase();
  currentUser = user;
  enterMain();
});

$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const u = $('loginUsername').value.trim().toLowerCase();
  const p = $('loginPassword').value;
  const err = $('loginError');
  err.textContent = '';

  const users = DB.users;
  if (!users[u]) return err.textContent = 'Пользователь не найден';
  if (users[u].password !== btoa(p)) return err.textContent = 'Неверный пароль';

  DB.session = u;
  currentUser = users[u];
  currentUser.lastSeen = Date.now();
  enterMain();
});

$('logoutBtn').addEventListener('click', () => {
  if (!confirm('Выйти из аккаунта?')) return;
  saveUser();
  const online = DB.online;
  delete online[currentUser.username];
  DB.online = online;
  DB.session = null;
  currentUser = null;
  showScreen('auth');
  $('loginForm').reset();
  $('registerForm').reset();
});

function saveUser() {
  if (!currentUser) return;
  currentUser.lastSeen = Date.now();
  const users = DB.users;
  users[currentUser.username.toLowerCase()] = currentUser;
  DB.users = users;
}

/* =========================================================
   MAIN
   ========================================================= */
function enterMain() {
  heartbeat();
  updateTopBar();
  renderQuizzes();
  renderAchievements();
  renderLeaderboard();
  renderFriends();
  showScreen('main');
  checkInvites();
}

function updateTopBar() {
  $('userLevel').textContent = 'Ур. ' + currentUser.level;
  $('userXp').textContent = currentUser.xp + ' XP';
  $('userAvatar').textContent = currentUser.username[0].toUpperCase();
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    $(btn.dataset.view + 'View').classList.add('active');
    if (btn.dataset.view === 'leaderboard') renderLeaderboard();
    if (btn.dataset.view === 'achievements') renderAchievements();
    if (btn.dataset.view === 'friends') renderFriends();
  });
});

/* =========================================================
   QUIZZES RENDER (с никами друзей над квизом)
   ========================================================= */
function renderQuizzes() {
  const grid = $('quizGrid');
  grid.innerHTML = '';
  const friends = currentUser.friends || [];

  Object.values(QUIZZES).forEach(q => {
    const done = currentUser.completed && currentUser.completed[q.id];

    // Определяем друзей, которые играли в этот квиз
    const playedFriends = friends.filter(fname => {
      const u = DB.users[fname.toLowerCase()];
      return u && u.completed && u.completed[q.id];
    });

    // Активные приглашения по этому квизу
    const activeInvites = DB.invites.filter(i =>
      i.quizId === q.id && i.from === currentUser.username
    );
    const invitedNames = activeInvites.map(i => i.to);

    const card = document.createElement('div');
    card.className = 'quiz-card' + (done ? ' completed' : '');
    card.style.setProperty('--accent', q.accent);

    // Формируем блок с игроками над квизом
    let playersHtml = '';
    const allPlayers = [
      { name: currentUser.username, me: true, online: true },
      ...friends.map(f => ({
        name: f,
        me: false,
        online: isOnline(f),
        invited: invitedNames.includes(f),
        played: playedFriends.includes(f)
      }))
    ];

    if (allPlayers.length > 0) {
      playersHtml = '<div class="quiz-players">';
      playersHtml += '<span class="quiz-players-label">Игроки:</span>';
      allPlayers.forEach(p => {
        const cls = p.me ? 'me' : (p.invited ? 'invited' : (p.online ? 'online' : ''));
        playersHtml += `<div class="player-tag ${cls}" title="${p.name}${p.me ? ' (вы)' : ''}${p.online ? ' • онлайн' : ''}${p.invited ? ' • приглашён' : ''}">
          <div class="mini-avatar">${p.name[0].toUpperCase()}</div>
          <span>${p.name}${p.me ? ' (вы)' : ''}</span>
        </div>`;
      });
      playersHtml += '</div>';
    }

    card.innerHTML = `
      <span class="quiz-emoji">${q.emoji}</span>
      <h3>${q.name}</h3>
      <p>${q.description}</p>
      ${playersHtml}
      <div class="quiz-meta">
        <span class="quiz-difficulty">${q.difficulty} • ${q.questions.length} вопр.</span>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;position:relative;z-index:1;">
        <button class="play-btn" data-play="${q.id}">▶ Играть</button>
        <button class="play-btn" style="background:rgba(255,140,0,0.25);" data-invite="${q.id}">👥 Пригласить</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

$('quizGrid').addEventListener('click', e => {
  const playBtn = e.target.closest('[data-play]');
  const invBtn = e.target.closest('[data-invite]');
  if (playBtn) startGame(playBtn.dataset.play);
  if (invBtn) openInviteModal(invBtn.dataset.invite);
});

/* =========================================================
   GAME LOGIC
   ========================================================= */
function startGame(quizId) {
  const quiz = QUIZZES[quizId];
  game = {
    quizId, quiz,
    round: 0,
    score: 0,
    correct: 0,
    wrong: 0,
    answered: false,
    timeLeft: 30,
    participants: []
  };

  // Собираем участников: сам игрок + друзья (все, кто онлайн или приглашён)
  game.participants.push({
    name: currentUser.username,
    me: true,
    online: true
  });

  const friends = currentUser.friends || [];
  // Добавляем до 3 друзей (тех, кто онлайн, приоритетно)
  const sortedFriends = friends.sort((a, b) => isOnline(b) - isOnline(a));
  sortedFriends.slice(0, 3).forEach(f => {
    game.participants.push({
      name: f,
      me: false,
      online: isOnline(f)
    });
  });

  $('gameQuizName').textContent = quiz.emoji + ' ' + quiz.name;
  $('chatMessages').innerHTML = '';
  renderChatParticipants();
  addChat('system', '🎃 Игра началась! Удачи!');
  game.participants.filter(p => !p.me).forEach((p, i) => {
    setTimeout(() => {
      addChat('system', `${p.name} присоединился к игре`);
    }, 800 + i * 600);
  });

  showScreen('game');
  nextRound();
}

function renderChatParticipants() {
  const cont = $('chatParticipants');
  cont.innerHTML = '';
  game.participants.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'participant-chip' + (p.me ? ' me' : '');
    chip.innerHTML = `
      <div class="mini-avatar">${p.name[0].toUpperCase()}</div>
      <span>${p.name}${p.me ? ' (вы)' : ''}</span>
    `;
    if (!p.me) {
      chip.title = p.online ? 'онлайн' : 'оффлайн';
    }
    cont.appendChild(chip);
  });
}

function nextRound() {
  if (game.round >= game.quiz.questions.length) {
    endGame();
    return;
  }
  const q = game.quiz.questions[game.round];
  game.answered = false;
  game.timeLeft = 30;
  $('gameRound').textContent = `Раунд ${game.round + 1}/${game.quiz.questions.length}`;
  $('questionText').textContent = q.q;
  $('gameTimer').textContent = game.timeLeft;
  $('gameTimer').classList.remove('warning');

  const cont = $('answersContainer');
  cont.innerHTML = '';
  q.answers.forEach((ans, i) => {
    const b = document.createElement('button');
    b.className = 'answer-btn';
    b.textContent = ans;
    b.dataset.idx = i;
    b.addEventListener('click', () => selectAnswer(i));
    cont.appendChild(b);
  });

  startTimer();

  // Боты (другие игроки) иногда отвечают в чате
  if (Math.random() < 0.5 && game.participants.length > 1) {
    const bot = game.participants.filter(p => !p.me)[Math.floor(Math.random() * (game.participants.length - 1))];
    const botMsgs = ['Хм, сложный вопрос...', 'Я знаю ответ!', 'Легкотня 😎', 'Дайте подумать...', 'Это точно вариант 1!', 'Ну и вопросики...'];
    setTimeout(() => {
      if (game && bot) addChat(bot.name, botMsgs[Math.floor(Math.random() * botMsgs.length)]);
    }, 2000 + Math.random() * 3000);
  }
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    game.timeLeft--;
    $('gameTimer').textContent = game.timeLeft;
    if (game.timeLeft <= 5) $('gameTimer').classList.add('warning');
    if (game.timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!game.answered) selectAnswer(-1);
    }
  }, 1000);
}

function selectAnswer(idx) {
  if (game.answered) return;
  game.answered = true;
  clearInterval(timerInterval);

  const q = game.quiz.questions[game.round];
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });

  if (idx === q.correct) {
    game.correct++;
    game.score += 10 + Math.max(0, game.timeLeft);
    addChat('system', `✅ ${currentUser.username} ответил верно! +${10 + Math.max(0, game.timeLeft)} очков`);
  } else {
    game.wrong++;
    addChat('system', `❌ Неверно. Правильно: ${q.answers[q.correct]}`);
  }

  game.round++;
  setTimeout(nextRound, 1600);
}

function endGame() {
  clearInterval(timerInterval);
  currentUser.gamesPlayed++;
  if (game.wrong === 0) currentUser.perfectGames++;
  if (!currentUser.completed) currentUser.completed = {};
  const prevBest = currentUser.completed[game.quizId]?.score || 0;
  if (game.score > prevBest) {
    currentUser.completed[game.quizId] = { score: game.score, date: Date.now() };
  }
  addXp(currentUser, game.score);
  saveUser();
  updateTopBar();
  checkAchievements();

  $('resultTitle').textContent = '🎃 Игра завершена!';
  $('resultStats').innerHTML = `
    <div class="stat"><span class="stat-value">${game.score}</span><span class="stat-label">Очков</span></div>
    <div class="stat"><span class="stat-value">${game.correct}</span><span class="stat-label">Верных</span></div>
    <div class="stat"><span class="stat-value">${game.wrong}</span><span class="stat-label">Ошибок</span></div>
  `;
  $('resultModal').classList.remove('hidden');
}

$('closeResultBtn').addEventListener('click', () => {
  $('resultModal').classList.add('hidden');
  renderQuizzes();
  renderAchievements();
  renderLeaderboard();
  showScreen('main');
});

$('leaveGameBtn').addEventListener('click', () => {
  if (!confirm('Покинуть игру? Прогресс не сохранится.')) return;
  clearInterval(timerInterval);
  showScreen('main');
});

/* =========================================================
   CHAT
   ========================================================= */
function addChat(author, text) {
  const c = $('chatMessages');
  const div = document.createElement('div');
  div.className = 'chat-msg' + (author === 'system' ? ' system' : '');
  if (author === 'system') div.textContent = text;
  else div.innerHTML = `<span class="author">${author}:</span>${text}`;
  c.appendChild(div);
  c.scrollTop = c.scrollHeight;
}

$('sendChatBtn').addEventListener('click', sendChat);
$('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

function sendChat() {
  const inp = $('chatInput');
  const text = inp.value.trim();
  if (!text) return;
  addChat(currentUser.username, text);
  currentUser.messagesSent = (currentUser.messagesSent || 0) + 1;
  saveUser();
  checkAchievements();
  inp.value = '';

  // Случайный ответ от участника
  if (game && game.participants.length > 1) {
    const others = game.participants.filter(p => !p.me);
    if (others.length && Math.random() < 0.7) {
      const bot = others[Math.floor(Math.random() * others.length)];
      const bots = ['Ого, я тоже так думаю!', 'Ха-ха, согласен 😄', 'Кто это сказал?', 'Не подсказывай!', 'Интересно 🤔', 'Погнали дальше!', 'Точно!', 'Не уверен...'];
      setTimeout(() => {
        if (game) addChat(bot.name, bots[Math.floor(Math.random() * bots.length)]);
      }, 1200 + Math.random() * 1500);
    }
  }
}

/* =========================================================
   ACHIEVEMENTS
   ========================================================= */
function renderAchievements() {
  const grid = $('achievementsGrid');
  grid.innerHTML = '';
  ACHIEVEMENTS.forEach(a => {
    const unlocked = currentUser.achievements && currentUser.achievements.includes(a.id);
    const div = document.createElement('div');
    div.className = 'achievement ' + (unlocked ? 'unlocked' : 'locked');
    div.innerHTML = `
      <div class="achievement-icon">${a.icon}</div>
      <h4>${a.name}</h4>
      <p>${a.desc}</p>
    `;
    grid.appendChild(div);
  });
}

function checkAchievements() {
  if (!currentUser.achievements) currentUser.achievements = [];
  ACHIEVEMENTS.forEach(a => {
    if (!currentUser.achievements.includes(a.id) && a.check(currentUser)) {
      currentUser.achievements.push(a.id);
      showToast(`🏆 Достижение: ${a.name}`);
    }
  });
  saveUser();
}

/* =========================================================
   LEADERBOARD
   ========================================================= */
function renderLeaderboard() {
  const users = Object.values(DB.users);
  users.sort((a, b) => (b.level * 1000 + b.xp) - (a.level * 1000 + a.xp));
  const list = $('leaderboardList');
  list.innerHTML = '';
  users.forEach((u, i) => {
    const rank = i + 1;
    const rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
    const online = isOnline(u.username);
    const row = document.createElement('div');
    row.className = 'leaderboard-row' + (u.username === currentUser.username ? ' me' : '');
    row.innerHTML = `
      <div class="rank ${rankClass}">${medal}</div>
      <div class="avatar">${u.username[0].toUpperCase()}</div>
      <div class="leaderboard-name">${u.username} ${online ? '<span style="color:#4caf50;font-size:12px;">● онлайн</span>' : ''}</div>
      <div class="leaderboard-xp">Ур. ${u.level} • ${u.xp} XP</div>
    `;
    list.appendChild(row);
  });
  if (!users.length) list.innerHTML = '<p style="opacity:0.6;">Пока никого нет</p>';
}

/* =========================================================
   FRIENDS
   ========================================================= */
$('searchBtn').addEventListener('click', () => {
  const q = $('friendSearch').value.trim().toLowerCase();
  const res = $('searchResults');
  res.innerHTML = '';
  if (!q) return;
  const users = DB.users;
  const found = Object.values(users).filter(u =>
    u.username.toLowerCase().includes(q) && u.username !== currentUser.username
  );
  if (!found.length) {
    res.innerHTML = '<p style="opacity:0.6;color:#c9a0dc;font-family:\'Segoe UI\',sans-serif;">Никого не найдено</p>';
    return;
  }
  found.forEach(u => {
    const isFriend = (currentUser.friends || []).includes(u.username);
    const online = isOnline(u.username);
    const item = document.createElement('div');
    item.className = 'friend-item';
    item.innerHTML = `
      <div class="avatar">${u.username[0].toUpperCase()}</div>
      <div class="name">${u.username} <span style="opacity:0.6;font-size:12px;">(Ур. ${u.level}${online ? ' • ● онлайн' : ''})</span></div>
      <button ${isFriend ? 'disabled style="background:rgba(255,255,255,0.15);"' : ''}>
        ${isFriend ? '✓ В друзьях' : 'Добавить'}
      </button>
    `;
    if (!isFriend) item.querySelector('button').addEventListener('click', () => addFriend(u.username));
    res.appendChild(item);
  });
});

function addFriend(name) {
  if (!currentUser.friends) currentUser.friends = [];
  if (!currentUser.friends.includes(name)) {
    currentUser.friends.push(name);
    saveUser();
    showToast(`✅ ${name} добавлен в друзья`);
    checkAchievements();
    renderFriends();
    renderQuizzes();
    $('searchBtn').click();
  }
}

function renderFriends() {
  const list = $('friendsList');
  list.innerHTML = '';
  if (!currentUser.friends || !currentUser.friends.length) {
    list.innerHTML = '<p style="opacity:0.6;color:#c9a0dc;font-family:\'Segoe UI\',sans-serif;">Пока никого нет. Найдите друзей через поиск!</p>';
  } else {
    currentUser.friends.forEach(name => {
      const u = DB.users[name.toLowerCase()];
      const online = isOnline(name);
      const item = document.createElement('div');
      item.className = 'friend-item';
      item.innerHTML = `
        <div class="avatar">${name[0].toUpperCase()}</div>
        <div class="name">${name} ${u ? `<span style="opacity:0.6;font-size:12px;">(Ур. ${u.level}${online ? ' • ● онлайн' : ''})</span>` : ''}</div>
        <button data-remove="${name}" style="background:rgba(255,255,255,0.15);">Удалить</button>
      `;
      item.querySelector('[data-remove]').addEventListener('click', () => {
        currentUser.friends = currentUser.friends.filter(f => f !== name);
        saveUser();
        renderFriends();
        renderQuizzes();
      });
      list.appendChild(item);
    });
  }
  renderInvites();
}

/* =========================================================
   INVITES
   ========================================================= */
function openInviteModal(quizId) {
  const quiz = QUIZZES[quizId];
  $('inviteQuizName').textContent = `Викторина: ${quiz.emoji} ${quiz.name}`;
  const sel = $('inviteFriendSelect');
  sel.innerHTML = '';
  if (!currentUser.friends || !currentUser.friends.length) {
    sel.innerHTML = '<option value="">— сначала добавьте друзей —</option>';
  } else {
    currentUser.friends.forEach(f => {
      const o = document.createElement('option');
      o.value = f;
      o.textContent = f + (isOnline(f) ? ' ● онлайн' : '');
      sel.appendChild(o);
    });
  }
  $('inviteModal').dataset.quizId = quizId;
  $('inviteModal').classList.remove('hidden');
}

$('cancelInviteBtn').addEventListener('click', () => $('inviteModal').classList.add('hidden'));

$('sendInviteBtn').addEventListener('click', () => {
  const friend = $('inviteFriendSelect').value;
  if (!friend) return showToast('Сначала добавьте друзей');
  const quizId = $('inviteModal').dataset.quizId;
  const inviteId = 'inv_' + Date.now();
  const invites = DB.invites;
  invites.push({
    from: currentUser.username,
    to: friend,
    quizId,
    date: Date.now(),
    id: inviteId
  });
  DB.invites = invites;
  $('inviteModal').classList.add('hidden');
  showToast(`📨 Приглашение отправлено: ${friend}`);
  renderQuizzes();
  // Симуляция принятия через 6 сек
  setTimeout(() => {
    showToast(`🎮 ${friend} принял приглашение! Можно играть вместе.`);
    renderQuizzes();
  }, 6000);
});

function checkInvites() {
  const invites = DB.invites.filter(i => i.to === currentUser.username);
  invites.forEach(inv => {
    if (!inv.notified) {
      showToast(`📨 ${inv.from} приглашает вас в "${QUIZZES[inv.quizId]?.name}"`);
      inv.notified = true;
    }
  });
  // Сохраняем обновлённые флаги
  const allInvites = DB.invites;
  allInvites.forEach(i => {
    const found = invites.find(x => x.id === i.id);
    if (found) i.notified = found.notified;
  });
  DB.invites = allInvites;
  renderInvites();
}

function renderInvites() {
  const list = $('invitesList');
  if (!list) return;
  list.innerHTML = '';
  const invites = DB.invites.filter(i => i.to === currentUser.username);
  if (!invites.length) {
    list.innerHTML = '<p style="opacity:0.6;color:#c9a0dc;font-family:\'Segoe UI\',sans-serif;">Нет активных приглашений</p>';
    return;
  }
  invites.forEach(inv => {
    const quiz = QUIZZES[inv.quizId];
    const item = document.createElement('div');
    item.className = 'friend-item';
    item.innerHTML = `
      <div class="avatar">${inv.from[0].toUpperCase()}</div>
      <div class="name">${inv.from} → ${quiz?.emoji || '🎯'} ${quiz?.name || ''}</div>
      <button data-accept="${inv.id}">Принять</button>
      <button data-decline="${inv.id}" style="background:rgba(255,255,255,0.15);">✕</button>
    `;
    item.querySelector('[data-accept]').addEventListener('click', () => {
      DB.invites = DB.invites.filter(i => i.id !== inv.id);
      startGame(inv.quizId);
    });
    item.querySelector('[data-decline]').addEventListener('click', () => {
      DB.invites = DB.invites.filter(i => i.id !== inv.id);
      renderInvites();
    });
    list.appendChild(item);
  });
}

// Периодическая проверка приглашений
setInterval(() => {
  if (currentUser && screens.main.classList.contains('active')) {
    checkInvites();
  }
}, 5000);

/* =========================================================
   AUTO LOGIN
   ========================================================= */
(function init() {
  const session = DB.session;
  if (session && DB.users[session]) {
    currentUser = DB.users[session];
    enterMain();
  } else {
    showScreen('auth');
  }
})();
</script>
</body>
